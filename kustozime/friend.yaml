apiVersion: apps/v1
kind: Deployment
metadata:
  name: rihlar-friend
  namespace: rihlar
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rihlar-friend
  template:
    metadata:
      labels:
        app: rihlar-friend
    spec:
      containers:
        - name: rihlar-friend
          image: ghcr.io/rihlar/rihlar_back/rihlar-friend:latest
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: "100m"    # 例：100ミリコア
              memory: "128Mi"
            limits:
              cpu: "500m"    # 例：500ミリコア
              memory: "256Mi"
          env:
            - name: SessionSecret
              valueFrom:
                secretKeyRef:
                  name: rihlarsecret
                  key: SessionSecret

            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: rihlarsecret
                  key: AppdbDSN

---
apiVersion: v1
kind: Service
metadata:
  name: rihlar-friend-svc
  namespace: rihlar
spec:
  type: LoadBalancer
  selector:
    app: rihlar-friend
  ports:
  - port: 8090
    targetPort: 8090

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rihlar-scaling-friend
  namespace: rihlar
spec:
  maxReplicas: 20
  behavior:
    scaleDown:
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      stabilizationWindowSeconds: 0
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      selectPolicy: Max
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rihlar-friend
